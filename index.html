<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E8EDF1;--surface:#F6F8FA;--ink:#17212B;--muted:#5B6B79;--line:#C5CFD8;
  --accent:#0E6B63;--accent-ink:#FFFFFF;--green:#1F8A4C;--warn:#A15C07;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10181F;--surface:#172230;--ink:#E6ECF1;--muted:#93A3B1;--line:#2A3A49;
    --accent:#4FC3B5;--accent-ink:#0B1B19;--green:#5BD08A;--warn:#E0A44F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10181F;--surface:#172230;--ink:#E6ECF1;--muted:#93A3B1;--line:#2A3A49;
  --accent:#4FC3B5;--accent-ink:#0B1B19;--green:#5BD08A;--warn:#E0A44F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{margin-bottom:18px}
h1{font-size:26px;line-height:1.15;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.date{color:var(--muted);font-size:14px;margin:0}
.progress{margin:16px 0 0;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease,background .25s ease}
.progress.done i{background:var(--green)}
.count{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
section{margin-top:22px;border-top:2px solid var(--line);padding-top:14px}
section.complete{border-top-color:var(--accent)}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);flex:none}
section.complete .sh .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
h2{font-size:18px;margin:0;font-weight:600}
.sh small{margin-left:auto;color:var(--muted);font-size:13px}
.row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px;color:var(--ink);-webkit-tap-highlight-color:transparent}
.row:focus-visible,.opt:focus-visible,.seg button:focus-visible,.reset:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.box{width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.box svg{width:16px;height:16px;opacity:0;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.row[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.row[aria-checked="true"] .box svg{opacity:1}
.row[aria-checked="true"]{border-color:var(--accent)}
.row[aria-checked="true"] span.t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.row.green[aria-checked="true"]{border-color:var(--green)}
.row.green[aria-checked="true"] .box{background:var(--green);border-color:var(--green)}
.row.green[aria-checked="true"] span.t{color:var(--green);text-decoration:none;font-weight:600}
.row[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.opt{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt b{display:block;font-weight:600}
.opt span{display:block;font-size:14px;color:var(--muted)}
.opt[aria-checked="true"]{border:2px solid var(--accent);padding:11px}
.bias{display:flex;align-items:center;gap:14px;margin:12px 0 8px;padding:14px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.bias svg{width:44px;height:44px;flex:none;stroke:var(--accent);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bias .l{font-size:13px;color:var(--muted)}
.bias .v{font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.seg{display:flex;gap:6px;align-items:center;margin-top:8px}
.seg em{font-style:normal;font-size:14px;color:var(--muted);margin-right:4px}
.seg button{all:unset;box-sizing:border-box;padding:8px 18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font-size:13px;color:var(--warn);margin:2px 2px 0}
.done-msg{margin-top:22px;padding:14px;border:2px solid var(--green);border-radius:8px;color:var(--green);font-weight:600;display:none}
.done-msg.on{display:block}
.reset{all:unset;box-sizing:border-box;display:block;margin:28px auto 0;padding:10px 16px;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer}
.news{margin:0 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.news h3{margin:0;padding:10px 12px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.news .msg{padding:12px;font-size:14px;color:var(--muted)}
.news .msg a{color:var(--accent)}
.ev{display:grid;grid-template-columns:68px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.ev:last-child{border-bottom:0}
.ev time{font-variant-numeric:tabular-nums;color:var(--muted)}
.ev .m{font-weight:600}
.ev .s{color:var(--muted);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.cur{display:inline-block;padding:0 6px;border-radius:4px;border:1px solid var(--line);font-size:12px;font-weight:600;margin-right:6px}
.info{margin-top:6px;font-size:13px}
.info summary{cursor:pointer;color:var(--accent)}
.info p{margin:6px 0 0;color:var(--muted)}
.info b{color:var(--ink);font-weight:600}
#journal{margin-top:28px;border-top:2px solid var(--line);padding-top:14px}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#journal label{display:block;font-size:13px;color:var(--muted)}
#journal select,#journal input,#journal textarea{display:block;width:100%;margin-top:4px;padding:10px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.jn{margin-top:10px}
.btn{all:unset;box-sizing:border-box;display:block;width:100%;margin-top:12px;padding:12px;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:8px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.jmsg{font-size:13px;color:var(--muted);margin:8px 0 0}
#jsetup{margin-top:12px;font-size:14px}
#jsetup summary{cursor:pointer;color:var(--accent)}
.jh{font-size:16px;margin:22px 0 8px}
.jf{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px;padding:10px 12px}
.jf summary{cursor:pointer;font-weight:600}
.jf .st{display:block;font-weight:400;color:var(--muted);font-size:13px}
.jf .jf{background:var(--bg);margin:8px 0 0}
.jd{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:14px}
.jd p{margin:4px 0;white-space:pre-wrap}
.jd b{font-weight:600}
.risk{margin:10px 0 2px}
.rb{display:flex;gap:4px}
.rb i{flex:1;height:8px;border-radius:4px}
.rt{font-size:14px;color:var(--muted);margin-top:6px}
.rt b{font-weight:700}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Pre-trade checklist</h1>
    <p class="date" id="date"></p>
    <div class="progress" id="bar"><i id="fill"></i></div>
    <div class="count"><span id="cnt"></span><span>Resets at midnight London time</span></div>
  </header>
  <div id="app"></div>
  <p class="done-msg" id="done">Checklist complete. Trade entered for today.</p>
  <section id="journal">
    <div class="sh"><span class="n">J</span><h2>Daily journal</h2></div>
    <div class="jgrid">
      <label>Result<select id="j-outcome"><option value="">Select</option><option>Win</option><option>Loss</option><option>Breakeven</option><option>No trade</option></select></label>
      <label>Result in R<input id="j-r" type="text" placeholder="1.5 or -1" autocomplete="off" autocapitalize="off"></label>
      <label>Followed the plan?<select id="j-plan"><option value="">Select</option><option>Yes</option><option>Partly</option><option>No</option></select></label>
      <label>London bias was right?<select id="j-bias"><option value="">Select</option><option>Yes</option><option>No</option><option>Unsure</option></select></label>
    </div>
    <label class="jn">Notes<textarea id="j-notes" rows="5" placeholder="What happened and what to change"></textarea></label>
    <button class="btn" id="jsave" type="button">Save day to Sheet</button>
    <p class="jmsg" id="jmsg"></p>
    <details id="jsetup"><summary>Sheet connection</summary>
      <label>Web app link<input id="g-url" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label>
      <label>Passcode<input id="g-sec" type="password"></label>
      <button class="btn ghost" id="gsave" type="button">Save connection</button>
    </details>
    <h3 class="jh">Past days</h3>
    <div id="jpast"><p class="jmsg">Past days appear here once your Sheet is connected.</p></div>
  </section>
  <button class="reset" id="reset" type="button">Reset now</button>
</main>
<script>
(function(){
  var KEY='fx-checklist-v1', TZ='Europe/London';
  var NEWS=['Checked today’s economic calendar','Noted GBP and JPY event times','Planned around the events (or sitting out)'];
  var FEED='news.json';
  var news={state:'loading',items:[]};
  var IMP={High:{c:'#D64545'},Medium:{c:'#E08A2E'},Holiday:{c:'#8A97A3'}};
  // EVENT_INFO START: edit the notes here. k = words to look for in the event title (lowercase, first match wins, put specific ones first), m = what it measures, e = usual effect.
  var H='Higher than forecast is good for the currency.', L='Lower than forecast is good for the currency.';
  var EVENT_INFO={
    GBP:[
      {k:'bank rate votes',m:'How many MPC members voted to raise, hold or cut the interest rate.',e:'More votes for a hike (or fewer for a cut) than expected is good for GBP.'},
      {k:'official bank rate',m:'The interest rate set by the Bank of England.',e:'A higher rate than expected is good for GBP. The vote split and statement can matter more than the rate itself.'},
      {k:'monetary policy summary',m:'The MPC’s reasoning and outlook for interest rates.',e:'A more hawkish tone than expected is good for GBP.'},
      {k:'monetary policy report',m:'The Bank of England’s forecasts for inflation and growth.',e:'Higher rate or inflation forecasts than expected are good for GBP.'},
      {k:'speaks',m:'Remarks from a central bank official.',e:'Hawkish comments are good for GBP, dovish comments are bad. It can move price without any data.'},
      {k:'cpi',m:'Change in the prices consumers pay (core leaves out food and energy). The main driver of Bank of England policy.',e:H},
      {k:'ppi',m:'Change in the prices manufacturers pay or charge. An early signal for consumer inflation.',e:H},
      {k:'retail sales',m:'Change in the value of retail sales. A key gauge of consumer spending.',e:H},
      {k:'gdp',m:'Change in the value of all goods and services produced.',e:H},
      {k:'claimant count',m:'Change in the number of people claiming unemployment benefits.',e:L},
      {k:'unemployment rate',m:'Share of the workforce that is jobless and looking for work.',e:L},
      {k:'earnings',m:'Change in the wages paid to employees. Feeds into inflation.',e:H},
      {k:'pmi',m:'Survey of purchasing managers. Above 50 means the sector is growing.',e:H},
      {k:'production',m:'Change in the output of factories, mines and utilities.',e:H},
      {k:'trade balance',m:'Difference between the value of exports and imports.',e:'A bigger surplus (or smaller deficit) than forecast is good for the currency.'},
      {k:'current account',m:'Difference between money flowing in and out of the country.',e:'A bigger surplus (or smaller deficit) than forecast is good for the currency.'},
      {k:'borrowing',m:'How much the government borrowed in the period.',e:L},
      {k:'confidence',m:'Survey of how consumers feel about their finances and the economy.',e:H},
      {k:'hpi',m:'Change in house prices.',e:H},
      {k:'mortgage approvals',m:'Number of new mortgages approved by lenders.',e:H},
      {k:'holiday',m:'Banks are closed.',e:'Few releases and thin trading, so moves can be erratic.'}
    ],
    JPY:[
      {k:'policy rate',m:'The interest rate set by the Bank of Japan.',e:'A higher rate than expected is good for JPY. The statement and press conference can matter more.'},
      {k:'monetary policy statement',m:'The Bank of Japan’s decision, reasoning and outlook.',e:'A more hawkish tone than expected is good for JPY.'},
      {k:'press conference',m:'The Governor’s briefing after the policy decision.',e:'Hawkish remarks are good for JPY, dovish remarks are bad.'},
      {k:'outlook report',m:'The Bank of Japan’s quarterly forecasts for growth and inflation.',e:'Higher growth or inflation forecasts are good for JPY.'},
      {k:'speaks',m:'Remarks from a central bank official.',e:'Hawkish comments are good for JPY, dovish comments are bad. It can move price without any data.'},
      {k:'cpi',m:'Change in the prices consumers pay. Tokyo CPI is an early read on the national figure.',e:H},
      {k:'gdp',m:'Change in the value of all goods and services produced.',e:H},
      {k:'tankan',m:'Quarterly survey of Japanese firms’ business conditions. Above 0 means more firms are optimistic than pessimistic.',e:H},
      {k:'trade balance',m:'Difference between the value of exports and imports.',e:'A bigger surplus (or smaller deficit) than forecast is good for the currency.'},
      {k:'current account',m:'Difference between money flowing in and out of the country.',e:'A bigger surplus (or smaller deficit) than forecast is good for the currency.'},
      {k:'household spending',m:'Change in the amount households spend.',e:H},
      {k:'unemployment rate',m:'Share of the workforce that is jobless and looking for work.',e:L},
      {k:'earnings',m:'Change in the wages paid to employees. Feeds into inflation.',e:H},
      {k:'retail sales',m:'Change in the value of retail sales.',e:H},
      {k:'production',m:'Change in the output of factories, mines and utilities.',e:H},
      {k:'machine',m:'Change in new orders for machinery, a gauge of business investment.',e:H},
      {k:'economy watchers',m:'Survey of workers in retail and hospitality about current conditions. Above 50 is positive.',e:H},
      {k:'pmi',m:'Survey of purchasing managers. Above 50 means the sector is growing.',e:H},
      {k:'holiday',m:'Banks are closed.',e:'Few releases and thin trading, so moves can be erratic.'}
    ]
  };
  // EVENT_INFO END
  var FOLDER={High:'Red folder: high impact, can move price sharply.',Medium:'Orange folder: medium impact.',Holiday:'Grey folder: holiday or non-economic, expect thin trading.'};
  function infoFor(e){
    var t=String(e.title).toLowerCase(), list=EVENT_INFO[e.country]||[];
    for(var i=0;i<list.length;i++){ if(t.indexOf(list[i].k)>-1) return list[i]; }
    return null;
  }
  function infoHTML(e){
    var i=infoFor(e), b='<details class="info"><summary>Measures and usual effect</summary>';
    b+='<p><b>Folder:</b> '+FOLDER[e.impact]+'</p>';
    if(i) b+='<p><b>Measures:</b> '+esc(i.m)+'</p><p><b>Usual effect:</b> '+esc(i.e)+'</p>';
    else b+='<p>No note for this event yet. Add one in the EVENT_INFO list.</p>';
    return b+'</details>';
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function loadNews(){
    fetch(FEED,{cache:'no-store'}).then(function(r){if(!r.ok) throw new Error('http '+r.status); return r.json();}).then(function(list){
      var t=today(), f=new Intl.DateTimeFormat('en-CA',{timeZone:TZ});
      news.items=list.filter(function(e){
        return (e.country==='GBP'||e.country==='JPY')&&IMP[e.impact]&&f.format(new Date(e.date))===t;
      }).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
      news.state='ok'; render();
    }).catch(function(){news.state='error'; render();});
  }
  function newsHTML(){
    var b='<div class="news"><h3><span>GBP and JPY news today</span><span>Red, orange, grey</span></h3>';
    if(news.state==='loading') b+='<div class="msg">Loading from Forex Factory…</div>';
    else if(news.state==='error') b+='<div class="msg">Couldn’t load today’s news file. Check <a href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener">Forex Factory</a> directly.</div>';
    else if(!news.items.length) b+='<div class="msg">No red, orange or grey GBP or JPY events today (London time).</div>';
    else news.items.forEach(function(e){
      var tm=new Date(e.date).toLocaleTimeString('en-AU',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true});
      var sub=[e.forecast?'Forecast '+esc(e.forecast):'',e.previous?'Previous '+esc(e.previous):''].filter(Boolean).join(' · ');
      b+='<div class="ev"><time>'+tm+'</time><div><div class="m"><span class="dot" style="background:'+IMP[e.impact].c+'"></span><span class="cur">'+esc(e.country)+'</span>'+esc(e.title)+'</div>'+(sub?'<div class="s">'+sub+'</div>':'')+infoHTML(e)+'</div></div>';
    });
    return b+'</div>';
  }
  var CONF=['Liquidity sweep','Break of structure','Fair value gap','Order block','Equilibrium'];
  var TRADE=['Has lot size been updated?','Enter trade'];
  var BIAS=[
    {k:'m',t:'Manipulation',d:'Asian session swept a level',r:'Reversal'},
    {k:'mr',t:'Manipulation, then reversal',d:'Asian session swept a level and reversed',r:'Continuation'},
    {k:'c',t:'Consolidation',d:'Asian session ranged tightly',r:'Reversal'}
  ];
  var TICK='<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
  var mem=null;

  function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());}
  function fresh(){return {date:today(),news:[0,0,0],asian:null,dir:null,conf:[0,0,0,0,0],trade:[0,0],j:{outcome:'',r:'',plan:'',biasRight:'',notes:''}};}
  function load(){
    var s=null;
    try{var raw=localStorage.getItem(KEY); if(raw) s=JSON.parse(raw);}catch(e){}
    if(!s) s=mem;
    if(!s||s.date!==today()) s=fresh();
    if(!s.j) s.j=fresh().j;
    if(!s.conf||s.conf.length!==5) s.conf=[0,0,0,0,0];
    return s;
  }
  function save(){mem=S; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  var S=load();

  function sum(a){return a.reduce(function(x,y){return x+y;},0);}
  function doneNews(){return sum(S.news)===3;}
  function doneBias(){return S.asian!==null;}
  function doneConf(){return sum(S.conf)>=1;}
  function ready(){return doneNews()&&doneBias();}

  var RISK=[null,{t:'High',c:'#D64545'},{t:'Medium-high',c:'#E08A2E'},{t:'Medium',c:'#C9A227'},{t:'Medium-low',c:'#7FB04A'},{t:'Low',c:'#2E9E5B'}];
  function riskHTML(){
    var n=sum(S.conf), r=RISK[n], segs='';
    for(var i=1;i<=5;i++) segs+='<i style="background:'+(i<=n?r.c:'var(--line)')+'"></i>';
    return '<div class="risk"><div class="rb">'+segs+'</div><div class="rt">'+(r?'Risk: <b style="color:'+r.c+'">'+r.t+'</b> · '+n+' of 5 confluences':'Tick confluences to see the risk rating')+'</div></div>';
  }
  function confText(){
    var n=sum(S.conf); if(!n) return '';
    return CONF.filter(function(t,i){return S.conf[i];}).join(', ')+' ('+n+'/5, '+RISK[n].t.toLowerCase()+' risk)';
  }
  function row(g,i,label,extra){
    var on=S[g][i]?'true':'false';
    var locked=extra&&extra.locked&&!S[g][i];
    return '<button type="button" class="row'+(extra&&extra.green?' green':'')+'" role="checkbox" aria-checked="'+on+'"'+(locked?' aria-disabled="true"':'')+' data-g="'+g+'" data-i="'+i+'"><span class="box">'+TICK+'</span><span class="t">'+label+'</span></button>';
  }
  function head(n,title,done,meta){
    return '<div class="sh"><span class="n">'+(done?'✓':n)+'</span><h2>'+title+'</h2>'+(meta?'<small>'+meta+'</small>':'')+'</div>';
  }

  function render(){
    var h='';
    h+='<section class="'+(doneNews()?'complete':'')+'">'+head(1,'News',doneNews(),sum(S.news)+' of 3');
    h+=newsHTML();NEWS.forEach(function(t,i){h+=row('news',i,t);});
    h+='</section>';

    h+='<section class="'+(doneBias()?'complete':'')+'">'+head(2,'Daily bias',doneBias(),'');
    BIAS.forEach(function(b){
      h+='<button type="button" class="opt" role="radio" aria-checked="'+(S.asian===b.k)+'" data-asian="'+b.k+'"><b>Asian: '+b.t+'</b><span>'+b.d+'</span></button>';
    });
    if(S.asian){
      var b=BIAS.filter(function(x){return x.k===S.asian;})[0];
      var icon=b.r==='Reversal'
        ?'<svg viewBox="0 0 44 44"><path d="M12 38V18a10 10 0 0 1 20 0v6"/><path d="M26 18l6 7 6-7"/></svg>'
        :'<svg viewBox="0 0 44 44"><path d="M6 22h30"/><path d="M26 12l10 10-10 10"/></svg>';
      h+='<div class="bias">'+icon+'<div><div class="l">London session bias</div><div class="v">'+b.r+'</div></div></div>';
      h+='<div class="seg"><em>Direction</em><button type="button" aria-pressed="'+(S.dir==='buy')+'" data-dir="buy">Buy</button><button type="button" aria-pressed="'+(S.dir==='sell')+'" data-dir="sell">Sell</button></div>';
    }
    h+='</section>';

    h+='<section class="'+(doneConf()?'complete':'')+'">'+head(3,'Confluences',doneConf(),sum(S.conf)+' of 5');
    CONF.forEach(function(t,i){h+=row('conf',i,t);});h+=riskHTML();
    h+='</section>';

    var tdone=sum(S.trade)===2;
    h+='<section class="'+(tdone?'complete':'')+'">'+head(4,'Trade',tdone,sum(S.trade)+' of 2');
    h+=row('trade',0,TRADE[0]);
    h+=row('trade',1,TRADE[1],{green:true,locked:!ready()});
    if(!ready()&&!S.trade[1]) h+='<p class="hint">Finish News and Daily bias to unlock Enter trade.</p>';
    h+='</section>';

    document.getElementById('app').innerHTML=h;

    var total=3+1+2, got=sum(S.news)+(S.asian?1:0)+sum(S.trade);
    document.getElementById('fill').style.width=(got/total*100)+'%';
    document.getElementById('cnt').textContent=got+' of '+total+' done';
    var all=got===total;
    document.getElementById('bar').className='progress'+(all?' done':'');
    document.getElementById('done').className='done-msg'+(all?' on':'');
    document.getElementById('date').textContent=new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',timeZone:TZ});
  }

  document.getElementById('app').addEventListener('click',function(e){
    var r=e.target.closest('[data-g]');
    if(r){
      if(r.getAttribute('aria-disabled')==='true') return;
      var g=r.dataset.g,i=+r.dataset.i;
      S[g][i]=S[g][i]?0:1; save(); render(); return;
    }
    var a=e.target.closest('[data-asian]');
    if(a){S.asian=(S.asian===a.dataset.asian)?null:a.dataset.asian; if(!S.asian) S.dir=null; save(); render(); return;}
    var d=e.target.closest('[data-dir]');
    if(d){S.dir=(S.dir===d.dataset.dir)?null:d.dataset.dir; save(); render();}
  });
  var GS_KEY='fx-gs-v1', cfg={url:'',secret:''}, rows=[];
  try{cfg=JSON.parse(localStorage.getItem(GS_KEY))||cfg;}catch(e){}
  function $(id){return document.getElementById(id);}
  function jmsg(t){$('jmsg').textContent=t;}
  function jFill(){var j=S.j;$('j-outcome').value=j.outcome;$('j-r').value=j.r;$('j-plan').value=j.plan;$('j-bias').value=j.biasRight;$('j-notes').value=j.notes;}
  function jRead(){S.j={outcome:$('j-outcome').value,r:$('j-r').value.replace('\u2212','-').replace(',','.').trim(),plan:$('j-plan').value,biasRight:$('j-bias').value,notes:$('j-notes').value};save();}
  ['j-outcome','j-r','j-plan','j-bias','j-notes'].forEach(function(id){$(id).addEventListener('input',jRead);});
  function entry(){
    var b=BIAS.filter(function(x){return x.k===S.asian;})[0];
    var got=sum(S.news)+(S.asian?1:0)+sum(S.trade);
    return {date:S.date,bias:b?b.t+' (London: '+b.r+')':'',direction:S.dir||'',
      confluences:confText(),
      outcome:S.j.outcome,r:S.j.r,plan:S.j.plan,biasRight:S.j.biasRight,notes:S.j.notes,
      checklist:got+'/6'+(S.trade[0]?', lot size updated':'')+(S.trade[1]?', trade entered':'')};
  }
  function jSave(){
    if(!cfg.url||!cfg.secret){$('jsetup').open=true;jmsg('Add your Sheet link and passcode first.');return;}
    jmsg('Saving…');
    fetch(cfg.url,{method:'POST',body:JSON.stringify({secret:cfg.secret,entry:entry()})})
      .then(function(r){return r.json();})
      .then(function(d){if(d.error) throw new Error(d.error);jmsg('Saved to your Sheet.');jLoad();})
      .catch(function(e){jmsg('Couldn’t save: '+e.message);});
  }
  function jLoad(){
    if(!cfg.url||!cfg.secret) return;
    fetch(cfg.url+'?secret='+encodeURIComponent(cfg.secret))
      .then(function(r){return r.json();})
      .then(function(d){if(d.error) throw new Error(d.error);rows=d.rows||[];jList();})
      .catch(function(e){$('jpast').innerHTML='<p class="jmsg">Couldn’t load past days: '+esc(e.message)+'</p>';});
  }
  function jList(){
    var by={};
    rows.forEach(function(r){var m=String(r.date).slice(0,7);(by[m]=by[m]||[]).push(r);});
    var months=Object.keys(by).sort().reverse(), h='';
    if(!months.length) h='<p class="jmsg">No days saved yet.</p>';
    months.forEach(function(m){
      var list=by[m].sort(function(a,b){return a.date<b.date?1:-1;}), w=0,l=0,be=0,tot=0;
      list.forEach(function(r){if(r.outcome==='Win')w++;else if(r.outcome==='Loss')l++;else if(r.outcome==='Breakeven')be++;var x=parseFloat(r.r);if(!isNaN(x))tot+=x;});
      var n=w+l+be, name=new Date(m+'-15T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
      h+='<details class="jf"><summary>'+name+'<span class="st">'+list.length+' days · '+n+' trades'+(n?' · '+Math.round(w/n*100)+'% wins':'')+' · '+(tot>0?'+':'')+Math.round(tot*100)/100+'R</span></summary>';
      list.forEach(function(r){
        var d=new Date(r.date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
        var rr=r.r!==''&&r.r!=null?' · '+(parseFloat(r.r)>0?'+':'')+esc(r.r)+'R':'';
        h+='<details class="jf"><summary>'+d+' · '+esc(r.outcome||'No result')+rr+'</summary><div class="jd">'
          +'<p><b>Bias:</b> '+esc(r.bias)+(r.direction?' · '+esc(r.direction):'')+'</p>'
          +'<p><b>Confluences:</b> '+esc(r.confluences||'none')+'</p>'
          +'<p><b>Checklist:</b> '+esc(r.checklist)+'</p>'
          +'<p><b>Bias right:</b> '+esc(r.biasRight||'-')+' · <b>Followed plan:</b> '+esc(r.plan||'-')+'</p>'
          +(r.notes?'<p><b>Notes:</b> '+esc(r.notes)+'</p>':'')+'</div></details>';
      });
      h+='</details>';
    });
    $('jpast').innerHTML=h;
  }
  function jInit(){jFill();$('g-url').value=cfg.url||'';$('g-sec').value=cfg.secret||'';jLoad();}
  $('jsave').addEventListener('click',jSave);
  $('gsave').addEventListener('click',function(){
    cfg={url:$('g-url').value.trim(),secret:$('g-sec').value};
    try{localStorage.setItem(GS_KEY,JSON.stringify(cfg));}catch(e){}
    jmsg('Connection saved.');jLoad();
  });
  document.getElementById('reset').addEventListener('click',function(){S=fresh(); save(); render(); jFill();});

  function check(){ if(S.date!==today()){S=fresh(); save(); news.state='loading'; render(); jFill(); loadNews();} }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) check(); });
  setInterval(check,60000);
  setInterval(loadNews,1800000);

  render();
  loadNews();
  jInit();
})();
</script>
</body>
</html>
